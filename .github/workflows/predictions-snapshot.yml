name: Predictions snapshot
# Free persistence layer for the predictions log on Render free plan:
# - Tuesday 00:30 UTC: refresh actuals (last GW finished by Mon evening)
# - Friday 17:00 UTC : snapshot model recommendations before the typical
#                       Saturday 11:30 UTC deadline
# - Commits the resulting JSON back to the repo so data survives Render redeploys.
#
# Merk: kjøringene her teller ikke som repo-aktivitet hos GitHub, og commit
# skjer bare når JSON-en endrer seg. Det er keepalive.yml som hindrer at denne
# workflowen blir auto-deaktivert etter 60 dager uten push.

on:
  schedule:
    - cron: '30 0 * * 2'   # Tue 00:30 UTC — pull actuals for the just-finished GW
    - cron: '0 17 * * 5'   # Fri 17:00 UTC — snapshot upcoming-GW recommendations
  workflow_dispatch:        # also runnable on demand from the Actions tab

concurrency:
  group: predictions-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine action from schedule
        id: action
        run: |
          if [ "${{ github.event.schedule }}" = "30 0 * * 2" ]; then
            echo "kind=refresh" >> "$GITHUB_OUTPUT"
          else
            echo "kind=snapshot" >> "$GITHUB_OUTPUT"
          fi

      - name: Hit production endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}   # e.g. https://fpl.kolakowski.no
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::APP_URL secret not set — configure repo secret to enable snapshot"
            exit 1
          fi
          # Render free-tier kan være kald eller midlertidig utilgjengelig:
          # prøv på nytt med økende pause før vi gir opp.
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 4 ]; then
                echo "::error::Ga opp etter $attempt forsøk: $*"
                return 1
              fi
              echo "Forsøk $attempt feilet — prøver igjen om $(( attempt * 15 ))s"
              sleep $(( attempt * 15 ))
              attempt=$(( attempt + 1 ))
            done
          }
          if [ "${{ steps.action.outputs.kind }}" = "refresh" ]; then
            retry curl -fsS --max-time 120 -X POST "$APP_URL/api/predictions/refresh-actuals" \
              -H 'Content-Type: application/json' -d '{}'
          else
            retry curl -fsS --max-time 120 -X POST "$APP_URL/api/predictions/snapshot" \
              -H 'Content-Type: application/json' -d '{}'
          fi
          echo
          # Pull the full log to commit
          mkdir -p data
          retry curl -fsS --max-time 120 "$APP_URL/api/predictions/log" -o data/predictions_log.json

      - name: Commit updated log
        run: |
          set -euo pipefail
          if git diff --quiet data/predictions_log.json 2>/dev/null; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add data/predictions_log.json
          git commit -m "chore(predictions): ${{ steps.action.outputs.kind }} $(date -u +%Y-%m-%dT%H:%MZ)"
          # keepalive.yml kan ha pushet en heartbeat i mellomtiden.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
